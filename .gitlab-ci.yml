#the following was the original ci/cd file before editing
#stages:
#- test
#- secret-detection
#sast:
#  stage: test
include:
  - template: 'Docker.gitlab-ci.yml'
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: 'Code-Quality.gitlab-ci.yml'
  - template: 'Browser-Performance.gitlab-ci.yml'
#  - template: 'Kubernetes.gitlab-ci.yml'
#  - template: 'AWS/Deploy-ECS.gitlab-ci.yml'
#  - template: 'Terraform.gitlab-ci.yml'
#  - template: 'CloudFoundry.gitlab-ci.yml'
#  - template: 'Heroku.gitlab-ci.yml'
variables:
 SECRET_DETECTION_ENABLED: 'true'
#secret_detection:
#  stage: secret-detection

#THIS IS THE END OF THE ORIGINAL CI/CD FILE
#the test stage must include scanning, authentification, .env detection, encryption

stages:
  - build
  - test
  - packaging
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk update
    - apk add --no-cache docker-cli
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_TOKEN"
  script:
    - docker build -t dockerlouis10565/edsafullstack:latest .
    - docker tag dockerlouis10565/edsafullstack:latest dockerlouis10565/edsafullstack:$CI_COMMIT_SHORT_SHA
    - docker push dockerlouis10565/edsafullstack:latest
    - docker push dockerlouis10565/edsafullstack:$CI_COMMIT_SHORT_SHA
  after_script:
    - docker logout
    - docker image prune -f
    - rm -f .env .env.gpg || true
    - rm -rf /tmp/* || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "push"
      changes:
        - Dockerfile
        - '**/*'
      when: always
    - when: never

test:
  stage: test
  image: php:8.0-cli
  services:
    - mysql:latest
    - redis:7
  before_script:
    - apt-get update && apt-get install -y curl jq git gnupg
    - test -f .env && echo ".env file detected" || echo "⚠️ .env file missing"
    - grep -i 'password\|secret\|token' .env || echo "✅ No exposed secrets in .env"
    - gpg --version
    - if [ -f .env.gpg ]; then gpg --quiet --batch --yes --decrypt --passphrase="$GPG_PASSPHRASE" --output .env .env.gpg; fi
  script:
    - php -v
    - composer install --no-interaction --prefer-dist
    - vendor/bin/phpunit --configuration phpunit.xml
    - curl -s http://localhost:8080/health || echo "⚠️ Healthcheck failed"
  after_script:
    - rm -f .env .env.gpg || true
    - docker logout || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - '**/*'
      when: always
    - when: never

packaging:
  stage: packaging
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk update
    - apk add --no-cache docker-cli
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_TOKEN"
  script:
    - docker tag yourname/app registry.digitalocean.com/your-registry/app:$CI_COMMIT_SHORT_SHA
    - docker push registry.digitalocean.com/your-registry/app:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: docker:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $SWARM_HOST >> ~/.ssh/known_hosts

  script:
    - scp docker-compose.yml $SWARM_USER@$SWARM_HOST:/home/$SWARM_USER/app/
    - ssh $SWARM_USER@$SWARM_HOST "docker stack deploy -c /home/$SWARM_USER/app/docker-compose.yml edsafullstack"

  after_script:
    - echo "✅ Swarm deployment complete"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual


