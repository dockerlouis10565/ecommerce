include:
  - template: 'Docker.gitlab-ci.yml'
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: 'Code-Quality.gitlab-ci.yml'
  - template: 'Browser-Performance.gitlab-ci.yml'
  - template: Jobs/Container-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: 'DAST.gitlab-ci.yml'
  - template: 'Security/License-Scanning.gitlab-ci.yml'
#  - template: 'Kubernetes.gitlab-ci.yml'
#  - template: 'AWS/Deploy-ECS.gitlab-ci.yml'
#  - template: 'Terraform.gitlab-ci.yml'
#  - template: 'CloudFoundry.gitlab-ci.yml'
#  - template: 'Heroku.gitlab-ci.yml'
variables:
 SECRET_DETECTION_ENABLED: 'true'
 DAST_VERSION: 6.3.0
#secret_detection:
#  stage: secret-detection

#THIS IS THE END OF THE ORIGINAL CI/CD FILE
#the test stage must include scanning, authentification, .env detection, encryption

stages:
  - build
  - test
  - deploy

# -------------------
# Build Stage
# -------------------
build:
  stage: build
  image: docker:cli 
  services:
    - docker:dind
  before_script:
    # Login to Docker Hub
    #- echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - docker login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD" $CI_REGISTRY
  script:
    -|
    if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
      docker buildx build --provenance=true --sbom=true --push \
        -t "$DOCKER_IMAGE_NAME" \
        -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE_NAME:latest" .
    else
      docker buildx build --provenance=true --sbom=true --push \
        -t "$DOCKER_IMAGE_NAME" \
        -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    fi
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile


# -------------------
# Test Stage
# -------------------
test:
  stage: test
  image: php:8.0-cli
  services:
    - mysql:latest
    - redis:7
  before_script:
    - apt-get update && apt-get install -y curl jq git gnupg composer
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        test -f .env && echo ".env file detected" || echo "⚠️ .env file missing"
        grep -i 'password\|secret\|token' .env || echo "✅ No exposed secrets in .env"
        if [ -f .env.gpg ]; then
          gpg --quiet --batch --yes --decrypt --passphrase="$GPG_PASSPHRASE" --output .env .env.gpg
        fi
      fi
  script:
    - php -v
    - composer install --no-interaction --prefer-dist
    - vendor/bin/phpunit --configuration phpunit.xml
  after_script:
    - rm -f .env .env.gpg || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
# -------------------
# Deploy Stage
# -------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    # Decode the base64 private key back into id_rsa
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $SWARM_HOST >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml $SWARM_USER@$SWARM_HOST:/home/$SWARM_USER/app/
    - ssh $SWARM_USER@$SWARM_HOST "IMAGE_TAG=$CI_COMMIT_SHORT_SHA docker stack deploy -c /home/$SWARM_USER/app/docker-compose.yml ecommerce"
  after_script:
    - echo "✅ Swarm deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual