# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

#the following was the original ci/cd file before editing
#stages:
#- test
#- secret-detection
#sast:
#  stage: test
include:
  - template: 'Docker.gitlab-ci.yml'
  - template: Security/Secret-Detection.gitlab-ci.yml
  
#  - template: 'Kubernetes.gitlab-ci.yml'
#  - template: 'AWS/Deploy-ECS.gitlab-ci.yml'
#  - template: 'Terraform.gitlab-ci.yml'
#  - template: 'CloudFoundry.gitlab-ci.yml'
#  - template: 'Heroku.gitlab-ci.yml'
variables:
 SECRET_DETECTION_ENABLED: 'true'
 DAST_VERSION: 6.3.0
#secret_detection:
#  stage: secret-detection

#THIS IS THE END OF THE ORIGINAL CI/CD FILE
#the test stage must include scanning, authentification, .env detection, encryption
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test
  - deploy

# -------------------
# Build Stage
# -------------------
build:
  stage: build
  image: docker:cli 
  services:
    - docker:dind
  before_script:
    # Login to Docker Hub
    #- echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - docker login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD" $CI_REGISTRY
  script:
    -|
    if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
      docker buildx build --provenance=true --sbom=true --push \
        -t "$DOCKER_IMAGE_NAME" \
        -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        -t "$DOCKER_IMAGE_NAME:latest" .
    else
      docker buildx build --provenance=true --sbom=true --push \
        -t "$DOCKER_IMAGE_NAME" \
        -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    fi
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile


# -------------------
# Test Stage
# -------------------
test:
  stage: test
  image: php:8.0-cli
  services:
    - mysql:latest
    - redis:7
  before_script:
    - apt-get update && apt-get install -y curl jq git gnupg composer
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        test -f .env && echo ".env file detected" || echo "⚠️ .env file missing"
        grep -i 'password\|secret\|token' .env || echo "✅ No exposed secrets in .env"
        if [ -f .env.gpg ]; then
          gpg --quiet --batch --yes --decrypt --passphrase="$GPG_PASSPHRASE" --output .env .env.gpg
        fi
      fi
    - |
      echo "Checking required env vars..."
      test -n "$DATABASE_URL" || (echo "❌ DATABASE_URL missing" && exit 1)
      test -n "$R2_ACCESS_KEY_ID" || (echo "❌ R2_ACCESS_KEY_ID missing" && exit 1)
  script:
    - php -v
    - composer install --no-interaction --prefer-dist
    - vendor/bin/phpunit --configuration phpunit.xml
  after_script:
    - rm -f .env .env.gpg || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
# -------------------
# Deploy Stage
# -------------------
deploy:
  stage: deploy
  image: docker:cli
  services:
    - docker:dind
  needs:
    - ["build","test"]
  script:
    - docker login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD"
    - docker push "$DOCKER_IMAGE_NAME:latest"
  after_script:
    - echo "✅ Swarm deployment complete"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual